<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 6 - JavaScript</title>
</head>
<body>
    <script type="text/javascript">
        var nome = prompt("Digite seu nome:"); // Solicita ao usuário que insira seu nome
        var anoatual = parseInt(prompt("Digite o ano atual:")); // Solicita ao usuário que insira o ano atual
        var anonascimento = parseInt(prompt("Digite o ano de nascimento:")); // Solicita ao usuário que insira o ano de nascimento
        var idade = anoatual - anonascimento; // Calcula a idade do usuário
        document.write("Olá, " + nome + "! Você tem " + idade + " anos."); // Exibe uma mensagem com o nome e a idade do usuário
    </script>
</body>
</html>
