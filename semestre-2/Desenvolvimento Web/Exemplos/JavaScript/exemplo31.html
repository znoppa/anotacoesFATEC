<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 31 - Sorteio de numeros aleatorios</title>
</head>
<body>
    <script type="text/javascript">

        // Aqui eu criei uma função pra funcionar como randint
        function randint(min, max) {
        min = Math.ceil(min);
        max = Math.floor(max);
        return Math.floor(Math.random() * (max - min + 1)) + min;
        }


        function sorteio(){
            num = randint(1, 9);
            return num;
        }
        document.write("<font size=7><b>SETE DA SORTE</b></font><br>")
        var a = sorteio();
        document.write("<font size=7>"+a+"</font>");
        var b = sorteio();
        document.write("<font size=7>"+b+"</font>");
        var c = sorteio();
        document.write("<font size=7>"+c+"</font>");

        if (a==7 && b==7 && c==7){
            document.write("<br><b><font size=7>GANHOU!!!</b></font>")
        }
        else{
            document.write("<br><b><font size=7>PERDEU!!!</b></font>")
        }

    </script>
</body>
</html>
