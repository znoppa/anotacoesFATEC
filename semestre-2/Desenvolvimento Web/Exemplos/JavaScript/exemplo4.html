<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 4 - JavaScript</title>
</head>
<body>
    <script type="text/javascript">

        var a = parseInt(prompt("Digite o valor de a:")); // Solicita ao usuário que insira o valor de a
        var b = parseInt(prompt("Digite o valor de b:"));
        // parseInt() é usado para converter a entrada do usuário em um número inteiro
        var soma = a + b; // Calcula a soma de a e b
        var diferenca = a - b; // Calcula a diferença entre a e b
        var produto = a * b; // Calcula o produto de a e b
        var media = (a + b) / 2;
        alert("A soma de " + a + " e " + b + " é: " + soma);
        alert("A diferença de " + a + " e " + b + " é: " + diferenca);
        alert("O produto de " + a + " e " + b + " é: " + produto);
        alert("A média de " + a + " e " + b + " é: " + media);
    </script>
</body>
</html>
