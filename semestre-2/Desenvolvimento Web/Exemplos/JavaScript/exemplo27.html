<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 27 - Função anonima</title>
</head>
<body>
    <script>
        var mensagem=function(){
            alert("Mensagem de uma função anônima");
        }
        mensagem(); // a funçãi foi atribuida a uma variável e chamada através dela
    </script>
</body>
</html>
