<body>
    <script type="text/javascript">
        var num1=parseInt("5") + "<br>";
        var num2=parseInt("5.00") + "<br>";
        var num3=parseInt("5.11") + "<br>";
        var num4=parseInt("14 25 11") + "<br>";
        var num5=parseInt("25 anos") + "<br>";
        var num6=parseInt("5",5) + "<br>";
        var num8=parseInt("050") + "<br>";
        var num9=parseInt("0x50") + "<br>";

        var resultado = num1 + num2 + num3 + num4 + num5 + num6 + num8 + num9;
        document.write(num1 + num2 + num3 + num4 + num5 + num6 + num8 + num9);
    </script>
