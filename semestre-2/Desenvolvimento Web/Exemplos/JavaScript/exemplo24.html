<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 24 - Funções Nativas 2</title>
</head>
<body>
    <script>
        var seuNome = prompt("Digite seu nome: ");
        document.write("Seu nome tem "+seuNome.length+" letras.<br>");
        document.write("Seu nome em maiúsculas: "+seuNome.toUpperCase()+"<br>");
        document.write("Seu nome em minúsculas: "+seuNome.toLowerCase()+"<br>");
        var texto = "Olá amigos!";
        var modificado = texto.replace("amigos", "pessoal");
        alert(modificado);
        var num=123.4;
        document.write(num.toFixed(3)+"<br>");
        document.write(num.toPrecision(2)+"<br>");
        document.write(num.toString()+"<br>");

        </script>
</body>
</html>
