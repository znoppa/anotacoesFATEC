<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pré e pós incremento</title>
</head>
<body>
    <script type="text/javascript">
        var a,b;
        var c=a=b=50;
        a=a++ +b; // a=50+50=100
        document.write("a="+a);
        alert("a="+a+" b="+b+" c="+c);

    </script>
</body>
