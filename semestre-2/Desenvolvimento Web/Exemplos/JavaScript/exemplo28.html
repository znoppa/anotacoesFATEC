<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 28 - Função com parâmetros</title>
</head>
<body>
    <script>
        function soma(a,b){
            var resultado=a+b;
            alert("O resultado da soma é: "+resultado);
            return resultado;
        }
        var x=10;
        var y=20;
        document.write("O resultado da soma é: "+soma(x,y));
    </script>
</body>
</html>
