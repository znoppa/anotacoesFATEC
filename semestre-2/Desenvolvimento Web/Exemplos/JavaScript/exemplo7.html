<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 7 - JavaScript</title>
</head>
<body>
    <script type="text/javascript">
        var nome = prompt("Digite seu nome:"); // Solicita ao usuário que insira seu nome
        alert("Olá, " + nome);
        var resp = confirm("Você deseja continuar?"); // Solicita ao usuário que confirme se deseja continuar
        if (resp == true) {
            alert("Você escolheu continuar.");
        } else {
            alert("Você escolheu não continuar.");
        }
    </script>
</body>
</html>
