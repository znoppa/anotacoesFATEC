<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="conteudo">
        <h1 align="center">CALCULO DE SALARIO</h1>
        <label>Entre com o valor da hora:</label>
        <input type="number" id="hora"><br>
        <label>Entre com a quantidade de horas:</label>
        <input type="number" id="qtd"><br>
        <p id="total"></p><br>
        <center><button onclick="calcular()">CALCULAR</button></center>
    </div>
    <script type="text/javascript">
        function calcular(){
            var hora = parseFloat(document.getElementById("hora").value);
            var qtd = parseFloat(document.getElementById("qtd").value);
            var salario= hora*qtd;
            document.getElementById("total").innerHTML = "Total a receber: "+ salario.toFixed(2);
        }
    </script>
</body>
</html>
