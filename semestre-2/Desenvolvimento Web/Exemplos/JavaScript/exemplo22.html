<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 22 - Exemplo Do-While</title>
</head>
<body>
    <script>
        var x=0;
        do{ // Primeiro executa o bloco de código e depois verifica a condição
            document.write("x="+x+"<br>");
            x++;
        }while(x<10);
    </script>
</body>
</html>
