<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação Simples</title>
</head>
<body>
    <div>
        <label>Usuario</label>
        <input type="text" name="user" size="10" maxlength="10" >
        <b id="resultado">*</b>
        <br>
        <label>Senha: </label>
        <input type="password" name="senha" size="10" maxlength="10">
        <b id="resultado2">*</b>
        <br>
        <button onclick="validar()" ondblclick="valida2()">Validar</button>
    </div>
    <script type="text/javascript">
        function validar(){
            var usuario = document.getElementsByName("user")
            var senha = document.getElementsByName("senha")
            if(usuario[0].value==""){
                document.getElementById("resultado").innerHTML="<font color='red'> Preenche o campo seu xisterfal </font>";
            } 
            if(senha[0].value==""){
                document.getElementById("resultado2").innerHTML="<font color='red'> Preenche o campo seu xisterfal </font>";
            } 
            if((usuario[0].value=="admin") && (senha[0].value == "123")){
                alert("Acesso liberado!!");
            }
            else{
                alert("Acesso negado!!");
            }
        }
        function valida2(){
            document.write("<font size=12> Chester </font>")
        }
    </script>
</body>
</html>
