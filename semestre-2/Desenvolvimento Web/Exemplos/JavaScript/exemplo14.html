<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 14 - JavaScript</title>
</head>
<body>
    <script type="text/javascript">
     var num = parseInt(prompt("Entre com um numero para contagem regressiva"));
     for(var x =num;x>0;x--){
        document.write(x + "<br>"); // recebeu o numero, vai fazer até o zero, diminuindo de 1 em 1, esperando 1 segundo para cada numero, e mostrando na tela
     }
    </script>
</body>
</html>
