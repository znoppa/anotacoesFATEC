<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 13 - JavaScript</title>
</head>
<body>
    <script type="text/javascript">
        var fruta = prompt("Digite o nome de uma fruta: ");
        switch(fruta){
            case "morango": document.write("Ótima escolha!");
            break;
            case "uva": document.write("Fruta verde");
            break;
            case "banana": document.write("Fruta amarela");
            break;
            default: document.write("Fruta não reconhecida");
        }
    </script>
</body>
</html>
