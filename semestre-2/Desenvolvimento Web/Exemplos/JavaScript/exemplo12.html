<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 12 - JavaScript</title>
</head>
<body>
    <script type="text/javascript">
     var idade = parseInt(prompt("Digite a idade do atleta:"));
     if(idade<7){
        document.write("Infantil");
     }
     else if(idade<11){
        document.write("Juvenil A");
     }
     else if(idade<18){
        document.write("Juvenil B");
     }
     else{
        document.write("Adulto");
     }
    </script>
</body>
</html>
