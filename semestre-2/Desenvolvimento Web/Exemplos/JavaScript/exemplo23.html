<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 23 - Funções Nativas</title>
</head>
<body>
    <script type="text/javascript">
        var seuNome;
        seuNome.prompt("Digite seu nome: ");
        for(var x=0;x< seuNome.length;x++){
            document.write("Letra "+(x+1)+" = "+seuNome.charAt(x)+"<br>");
        }
    </script>
</body>
</html>
