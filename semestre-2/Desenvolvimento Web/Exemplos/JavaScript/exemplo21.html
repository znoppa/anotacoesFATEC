<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 21 - Exemplo While</title>
</head>
<body>
    <script>
        var x=0;
        while(x<10){
            document.write("x="+x+"<br>");
            x++;
        }
    </script>
</body>
</html>
