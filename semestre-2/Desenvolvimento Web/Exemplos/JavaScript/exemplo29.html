<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 29 - Passagem por valor</title>
</head>
<body>
    <script>
        function compara(a,b){
            if(a>b){
                alert("O valor de a é maior que b");
            }else if(a<b){
                alert("O valor de a é menor que b");
            }else{
                alert("O valor de a é igual a b");
            }
        }
        var x=5;
        var y = 10;
        compara(x,y);
    </script>
</body>
</html>
