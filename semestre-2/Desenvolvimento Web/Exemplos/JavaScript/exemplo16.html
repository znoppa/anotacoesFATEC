<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 16 - Pré e pós processamento</title>
</head>
<body>
    <script type="text/javascript">
        var x=10;
        alert(x++) // pós incremento 10
        document.write(x + "<br>"); // 11
        alert(++x) // pré incremento 12
        document.write(x + "<br>"); // 12
    </script>
</body>
</html>
