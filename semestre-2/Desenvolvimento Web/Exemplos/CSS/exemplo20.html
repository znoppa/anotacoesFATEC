<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estilos e Divisões</title>
</head>
<style>
    div {
        background-color: aqua; /* Estilo em CSS Interno */
   }
   body {
        font-family: Arial, sans-serif; /* Estilo em CSS Interno */
        background-color: royalblue; /* Estilo em CSS Interno */
   }
   p {
        color: burlywood; /* Estilo em CSS Interno */
   }

</style>
<body>
    <div> <!-- Divisão / Container-->
        <h1>Divisão 1</h1>
        <p>Esta é a primeira divisão com um fundo azul claro.</p>
    </div>
</body>
</html>
