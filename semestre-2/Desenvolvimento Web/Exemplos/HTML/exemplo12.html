<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de tabelas</title>
</head>
<body>
    <table border="1"><!--Tabela com borda-->
        <caption>Tabela de preços</caption><!--Rótulo da tabela-->
        <tr><th>Produtos</th><th>R$</th></tr><!--tr=linha, th=cabeçalho-->
        <tr><td>Arroz</td><td>21,00</td></tr>
        <tr><td>Feijão</td><td>7,00</td></tr>
        <tr><td>Açucar</td><td>4,00</td></tr>
        <tr><td>Macarrão</td><td>3,50</td></tr>
    </table>
</body>
</html>
