<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 6 - Listas</title>
</head>
<body>
    <!--Lista ordenada-->
    <ol><!--type=a, A, i, I start="5"-->
        <li>item um</li>
        <li>item dois</li>
        <li>item três</li>
    </ol>
    <!--Lista não ordenada-->
    <ul type="square"><!--disc,square,circle-->
        <li>Pera</li>
        <li>Uva</li>
        <li>Maça</li>
        <li>Salada Mista</li>
    </ul>
    <!--Lista de definição-->
    <dl>
        <dt>HTML</dt>
        <dd>Linguagem de marcação de texto</dd>
    </dl>
</body>
</html>
