<!doctype html>

  <body>

    <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="2" aria-label="Slide 3"></button>
  </div>
  <div class="carousel-inner">
    <div class="carousel-item active">
        <img src="https://picsum.photos/id/46/1200/500" class="d-block w-100" alt="...">
        <div class="carousel-caption d-none d-md-block" style="text-shadow: 2px 2px 4px #000000" >
        <h5>Praias Paradisíacas</h5>
        <p >Descubra o nordeste brasileiro com até 30% de desconto</p>
      </div>
    </div>
    <div class="carousel-item">
      <img src="https://picsum.photos/id/29/1200/500" class="d-block w-100" alt="...">

        <h5>Aventuras nas Montanhas</h5>
        <p>Trilhas e experiências incríveis na Serra da Mantiqueira</p>
      </div>
    </div>
    <div class="carousel-item">
      <img src="https://picsum.photos/id/28/1200/500" class="d-block w-100" alt="...">
      <div class="carousel-caption d-none d-md-block" style="text-shadow: 2px 2px 4px #000000">
        <h5>Turismo Histórico</h5>
        <p>COnheça as cidade históricas de Minas Gerais</p>
        </div>
    </div>
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

</html>
