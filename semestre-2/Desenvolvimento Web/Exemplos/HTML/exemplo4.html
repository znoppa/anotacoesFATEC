<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiperlink com imagem</title>
</head>
<body background="marca.png"><!--imagem de fundo da página-->
    <h1>Hiperlinks com imagem</h1>
    <a href="https://www.google.com">
        <img src="google.png" width="128px" height="128px">
        <!--img src=exibe imagem informado no caminho -->
    </a>
    <a href="https://www.uol.com.br" >
        <img src="uol.png" width="128px" height="128px">
        <!--width=largura height=altura-->
    </a>
    <a href="https:www.r7.com" >
        <img src="r7.png" width="128px" height="128px">
    </a>
    <hr>
    <marquee scrollamount="50">Boa noite!</marquee><!--texto animado + velocidade-->
</body>
</html>
