<html>
    <head>
        <title>Exemplo 8 - frames em linhas</title>
    </head>
    <!-- frame divide a tela em linhas ou colunas -->
     <frameset rows="10%,20%,*">
        <frame src="frame1.html" noresize>
        <frame src="frame2.html">
        <frame src="frame3.html">    
     </frameset>
</html>
