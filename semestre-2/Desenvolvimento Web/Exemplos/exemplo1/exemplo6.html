<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 6</title>
</head>
<body>
    <!-- lista ordenada -->
    <ol type="I"> <!-- a, A, i, I -> Para letras e numeros romanos-->
        <li>item 1</li>
        <li>item 2</li>
        <li>item 3</li>
    </ol>
    <!-- lista não ordenada -->
    <ul type="square"> <!-- disk, square, circle-->
       <li>Pera</li>
       <li>Uva</li>
       <li>Maçã</li>
       <li>Salada Mista</li>
    </ul>
    <!-- Lista de definição -->
    <dl>
        <dt>HTML</dt>
        <dd>Linguagem de marcação de texto</dd>
    </dl>
</body>
</html>
