<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela com imagens</title>
</head>
<body>
    <table border="3" border-radius="10px" align="center">
        <caption>Tabela de imagens</caption>

            <th>Produtos</th><th>R$</th>
        </tr>
        <tr>
            <td><img src="./assets/logo_google.png" height="150px" width="150px"><p align="center">Google</p></td>
            <td><h1>0,01</h1></td>
        </tr>
        <tr>
            <td><img src="./assets/logo.png" height="150px" width="150px"><p align="center">Eu careca</p></td>
            <td><h1>3,00</h1></td>
        </tr>
        <tr>
            <td><img src="./assets/gatinho.png" height="150px" width="150px"><p align="center">Matheus</p></td>
            <td><h1>Grátis</h1></td>
        </tr>
    </table>
</body>
</html>
