<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela mesclável</title>
</head>
<body>
    <table border="3">
        <tr>
            <th rowspan="2">Duas linhas</th> <!-- "rowspan":  Mescla duas linhas-->
            <th colspan="2">Duas Colunas</th> <!-- "colspan": Mescla duas colunas-->
            <th colspan="2">Duas Colunas</th>
        </tr>
        <tr>
            <td>1-Celula Simples</td>
            <td>2-Celula Simples</td>
            <td>3-Celula Simples</td>
            <td>4-Celula Simples</td>
        </tr>
    </table>
</body>
</html>
