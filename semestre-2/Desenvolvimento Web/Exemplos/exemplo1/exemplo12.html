<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Tabela</title>
</head>
<body>
    <table border="3"> <!--Tabela-->
        <caption>Tabela de Preços</caption> <!--Rótulo da tabela-->
        <tr solid black><th solid black>Produtos</th> <!--Linha--><th>R$</th> <!--Cabeçalho--></tr> 
        <tr><td>Arroz</td><td>21,00</td></tr>
        <tr><td>Feijão</td><td>7,00</td></tr>
        <tr><td>Açucar</td><td>4,00</td></tr>
        <tr><td>Macarrão</td><td>3,50</td></tr>
    </table>
</body>
</html>
