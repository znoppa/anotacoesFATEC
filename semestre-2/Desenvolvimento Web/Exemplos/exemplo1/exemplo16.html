<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo Formulários</title>
</head>
<body>
    <form> <!-- Cria um formulário-->
        <h1>Exemplo de Formulário</h1>
        <label>Nome:</label> <!--Rótulo de formulário-->
        <input type="text" size="50" maxlength="50" placeholder="Digite seu nome" value="John Doe" name="nome" id="1" disabled> <!--Campo de texto-->
        <!-- Type = tipo, 
         size = tamanho, 
         maxlength = máximo de caracteres, 
         placeholder = texto de ajuda,
         value = valor inicial, 
         name = nome do campo, 
         id = identificador -->
        <label>Senha:</label>
        <input type="password" size="50" maxlength="50" placeholder="Digite sua senha" name="senha" id="2">
        <input type="radio" name="sexo" value="masculino" checked>Masculino <!--Botão de opção-->
        <input type="radio" name="sexo" value="feminino">Feminino
        <input type="checkbox" name="aceite" value="sim">Aceito os termos <!--Caixa de seleção-->
        <input type="submit" value="Enviar"> <!--Botão de envio-->
        <input type="reset" value="Limpar"> <!--Botão de reset-->
        <br>
        <label>Escolha o seu curso:</label>
        <select name="curso">
            <option>Análise e Desenvolvimento de Sistemas</option>
            <option>Gestão Empresarial</option>
            <option>Engenharia Mecânica</option>
            <option>Mecatrônica</option>
        </select>
        <input type="checkbox">Sim, eu quero receber novidades sobre o curso.
        <br>
        <textarea
    </form>
</body>
</html>
