<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo - Bootstrap</title>
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="#">Navbar</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item active">
                    <a class="nav-link" href="#">Home <span class="sr-only">(current)</span></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Features</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Pricing</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link disabled" href="#" tabindex="-1" aria-disabled="true">Disabled</a>
                </li>
            </ul>
        </div>
    </nav>
    <h1>Bem-vindo ao Bootstrap</h1>
    <hr>
    <h3>Exemplo de botões e suas cores</h3>
    <button class="btn btn-primary">Botão Primário</button>
    <button class="btn btn-secondary">Botão Secundário</button>
    <button class="btn btn-success">Botão de Sucesso</button>
    <button class="btn btn-danger">Botão de Perigo</button>
    <button class="btn btn-warning">Botão de Aviso</button>
    <button class="btn btn-info">Botão de Informação</button>
    <button class="btn btn-light">Botão Claro</button>
    <button class="btn btn-dark">Botão Escuro</button>
    <button class="btn btn-link">Botão Link</button>
    <hr>
    <h3>Exemplo de botões com tamanhos diferentes</h3>
    <button class="btn btn-primary btn-lg">Botão Grande</button>
    <button class="btn btn-primary btn-sm">Botão Pequeno</button>
    <hr>
    <h3>Exemplo de botões com outros estilos</h3>
    <button class="btn btn-outline-primary">Botão Primário Contorno</button>
    <button class="btn btn-outline-secondary">Botão Secundário Contorno</button>
    <button class="btn btn-outline-success">Botão de Sucesso Contorno</button>
    <button class="btn btn-outline-danger">Botão de Perigo Contorno</button>
    <button class="btn btn-outline-warning">Botão de Aviso Contorno</button>
    <button class="btn btn-outline-info">Botão de Informação Contorno</button>
    <button class="btn btn-outline-light">Botão Claro Contorno</button>
    <button class="btn btn-outline-dark">Botão Escuro Contorno</button>
    <hr>

    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
